<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendPro — Premium Online Marketplace</title>
    <meta name="description" content="TrendPro is a scalable, production-grade e-commerce marketplace featuring authentic catalog browsing, real-time cart, secure checkout, orders, wallet & vouchers, and owner dashboard." />
    <meta property="og:title" content="TrendPro — Premium Online Marketplace" />
    <meta property="og:description" content="TrendPro is a scalable, production-grade e-commerce marketplace featuring authentic catalog browsing, real-time cart, secure checkout, orders, wallet & vouchers, and owner dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="trendpro-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #4f46e5, #7c3aed); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 18px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);">
            TP
          </div>
          <span style="font-size: 20px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px;">TrendPro</span>
        </div>
        <div style="width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: tp-spin 0.8s linear infinite;"></div>
        <p style="font-size: 12px; color: #64748b; margin-top: 12px; font-weight: 500;">Connecting to TrendPro Marketplace...</p>
        <style>
          @keyframes tp-spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
